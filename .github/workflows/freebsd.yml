# Builds and tests the workspace on FreeBSD, inside a FreeBSD VM on a Linux runner
# (GitHub has no FreeBSD runners). GPU tests skip themselves when the VM has no adapter.
name: FreeBSD

# The VM build is slow, so it runs nightly on main and on pushes to `release`, not on every pull
# request: a drifted dependency still shows up within a day, and always before a release ships.
# PRs that change the FreeBSD workflow or packaging itself still run it.
on:
  push:
    branches: [release]
  pull_request:
    paths:
      - .github/workflows/freebsd.yml
      - packaging/freebsd/**
      - packaging/env.sh
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:

concurrency:
  group: freebsd-${{ github.ref }}
  # A push to main doesn't cancel the run in progress (the newest waiting run replaces older ones),
  # so main gets complete runs however often it moves; PR pushes do cancel.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  freebsd:
    uses: getnodalia/foundation/.github/workflows/freebsd.yml@ec62c63fd3206e4ed729fccf18a57170f8fa5dd6 # foundation main
    with:
      # The fonts commit the inherited gate used by default.
      fonts-repository: getnodalia/foundation
      fonts-ref: bfcbf714e45a3ea8e98f88ab2b7971372a576414
